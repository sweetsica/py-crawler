<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Scraper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input[type="url"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--primary-hover);
        }

        #result {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #334155;
            display: none;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .media-item {
            border-radius: 0.5rem;
            overflow: hidden;
            background: #0f172a;
            position: relative;
        }

        .media-item img, .media-item video {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .media-tag {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.6);
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 4px;
        }

        .error-message {
            color: var(--error);
            text-align: center;
            margin-top: 1rem;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            color: var(--text-muted);
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Media Scraper</h1>
        <form id="scrapeForm">
            <div class="form-group">
                <label for="url">Nhập link (FB, IG, X, Threads, Shopee):</label>
                <input type="url" id="url" name="url" placeholder="https://..." required>
            </div>
            <button type="submit">Trích xuất Media</button>
        </form>

        <div id="loading" class="loading">Đang xử lý, vui lòng chờ...</div>
        <div id="result"></div>
        <div style="margin-top: 2rem; text-align: center; color: var(--text-muted); font-size: 10px;">
            Nội dung cập nhật: 19:10 - Đã dọn dẹp file test & rác hệ thống <br>
            Branch: main050426-01
        </div>
    </div>

    <script>
        const form = document.getElementById('scrapeForm');
        const resultDiv = document.getElementById('result');
        const loading = document.getElementById('loading');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value;
            
            resultDiv.style.display = 'none';
            resultDiv.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch('/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });
                
                let data;
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const errorText = await response.text();
                    throw new Error(`Server trả về lỗi không định dạng JSON (HTTP ${response.status}): ${errorText.substring(0, 150)}...`);
                }

                loading.style.display = 'none';
                resultDiv.style.display = 'block';

                if (data.error) {
                    resultDiv.innerHTML = `<p class="error-message">${data.error}</p>`;
                } else {
                    let html = `<h3>Kết quả [${data.platform}]</h3>`;
                    html += `<div class="media-grid">`;
                    data.media.forEach(item => {
                        const proxyUrl = (original) => {
                            if (original.includes('video.twimg.com') || original.includes('pbs.twimg.com') || original.includes('fbcdn') || original.includes('cdninstagram')) {
                                return `/proxy?url=${encodeURIComponent(original)}`;
                            }
                            return original;
                        };

                        if (item.type === 'image') {
                            html += `<div class="media-item">
                                        <span class="media-tag">Ảnh</span>
                                        <a href="${item.url}" target="_blank">
                                            <img src="${proxyUrl(item.url)}" alt="media" referrerpolicy="no-referrer">
                                        </a>
                                        <div style="padding: 5px; text-align: center;">
                                            <a href="${item.url}" target="_blank" style="font-size: 10px; color: #818cf8; text-decoration: none;">Link gốc</a>
                                        </div>
                                     </div>`;
                        } else {
                            html += `<div class="media-item">
                                        <span class="media-tag">Video</span>
                                        <video controls src="${proxyUrl(item.url)}" referrerpolicy="no-referrer"></video>
                                        <div style="padding: 5px; text-align: center;">
                                            <a href="${item.url}" target="_blank" style="font-size: 10px; color: #818cf8; text-decoration: none;">Link Video</a>
                                        </div>
                                     </div>`;
                        }
                    });
                    html += `</div>`;
                    resultDiv.innerHTML = html;
                }
            } catch (err) {
                loading.style.display = 'none';
                resultDiv.style.display = 'block';
                resultDiv.innerHTML = `<p class="error-message">Lỗi kết nối server: ${err.message}</p>`;
            }
        };
    </script>
</body>
</html>
